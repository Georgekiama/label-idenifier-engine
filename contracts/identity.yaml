# ExhibitPro - Stage 5: Identity Composer contract
#
# THIS FILE IS THE OWNED ARTEFACT. Bump `version` whenever any value changes;
# tests/test_contracts.py enforces it against a content hash.
#
# The composer fuses several INDEPENDENT evidence sources. None of them decides
# alone. Every weight here is a claim that must be defended by an ablation on
# the goldens set - see tools/evaluate_labels.py --ablate.

version: "IDC-1.3.0"

# --- Lexicon ----------------------------------------------------------------
lexicon:
  # Words that may sit INSIDE a phrase without ending it.
  #
  # Classic RAKE splits on every stopword, which shatters exactly the phrases a
  # binder label is made of: "Motion to Compel" becomes "Motion" + "Compel".
  # Measured on the benchmark corpus, 30% of phrase-like units on page 1 contain
  # an interior stopword, including "TREATY WITH THE TRIBES OF MIDDLE OREGON".
  # These connectors are therefore kept when interior, and stripped when they
  # would begin or end a candidate. Quoted because YAML 1.1 reads bare `on`
  # and `no` as booleans - which silently removed two words from the lists.
  connectors:
    ["of", "to", "for", "and", "the", "a", "an", "in", "on", "at", "by",
     "with", "from", "v", "vs", "versus", "re", "per", "&"]

  # Split points for phrase extraction, in addition to punctuation.
  hard_stopwords:
    ["is", "are", "was", "were", "be", "been", "being", "has", "have",
     "had", "do", "does", "did", "will", "would", "shall", "should", "may",
     "might", "must", "can", "could", "that", "this", "these", "those",
     "which", "who", "whom", "whose", "what", "when", "where", "why", "how",
     "if", "then", "than", "but", "or", "nor", "so", "because", "however",
     "therefore", "thus", "also", "such", "it", "its", "they", "them",
     "their", "we", "our", "you", "your", "he", "she", "his", "her", "not",
     "no", "all", "any", "some", "more", "most", "other", "both", "each",
     "every"]

  # Never appear in a binder label, however they score.
  furniture:
    ["page", "pages", "continued", "cont", "see", "attachment", "appendix",
     "exhibit", "figure", "table", "chapter", "section", "appendices",
     "contents", "index", "note", "notes", "copyright", "reserved",
     "printed", "revised", "draft", "confidential"]

# --- Evidence: BM25 ---------------------------------------------------------
bm25:
  # Standard BM25 parameters. The adaptation: there is no query, so the
  # CANDIDATE PHRASE is treated as the query and the document as the corpus
  # entry. The score answers "how well does this phrase represent this
  # document, given corpus-wide term rarity".
  k1: 1.5
  b: 0.75
  # BM25 sums over query terms, so a long phrase always outscores a short one.
  # Dividing by len^alpha restores compactness preference. alpha=0.5 is the
  # geometric middle between raw sum (0.0) and plain mean (1.0).
  length_alpha: 0.5
  # IDF for a term absent from the frozen table. Unseen means rare means
  # informative, so it takes the table's maximum rather than zero.
  unseen_term_idf: max

# --- Evidence: RAKE ---------------------------------------------------------
rake:
  # Classic RAKE word score is deg(w)/freq(w). Candidate score is the sum over
  # its words, which rewards long phrases; the same length normalisation as
  # BM25 keeps that in check.
  length_alpha: 0.5
  max_phrase_words: 12
  min_word_chars: 2

# --- Evidence: TextRank -----------------------------------------------------
textrank:
  # Classical graph algorithm only - no neural variants, no embeddings.
  window: 3
  damping: 0.85
  # Fixed iteration count rather than a convergence test: two runs must produce
  # identical numbers, and a tolerance-based loop can differ in its last digit.
  iterations: 40
  length_alpha: 0.5

# --- Evidence: Phrase graph -------------------------------------------------
phrase_graph:
  # Edges are only ever created from measurable evidence. Each condition below
  # must hold for two units to be considered parts of one heading.
  max_vertical_gap_ratio: 2.2     # multiples of the page's median line gap
  max_size_delta: 0.6             # pt
  max_left_delta: 4.0             # pt, for left-aligned continuation
  max_center_delta: 12.0          # pt, for centred continuation
  max_chain: 3                    # units that may be composed into one label
  # Composition joiner. This is the ONE character the engine adds, and it joins
  # rather than invents: no word is created, and the audit records the exact
  # units composed. A continuation on the same visual block joins with a space.
  block_joiner: " - "
  min_part_words: 1
  max_composed_words: 16

# --- Typography hierarchy ---------------------------------------------------
typography:
  # Font sizes are clustered into levels by CHARACTER MASS, not by raw size, so
  # a single oversized Bates stamp cannot become the top level. A size must hold
  # this share of the segment's characters to found a level.
  min_level_mass: 0.03
  # ...OR this many characters set at that size, whichever qualifies first.
  #
  # Mass alone is backwards for titles: a title is SHORT by nature. Measured on
  # the benchmark, "BLACK HUCKLEBERRY" at 20pt holds 0.2% of the page's
  # characters and a NASA report title at 24pt holds 2.6% - both fell under a
  # 3% mass floor, were classified `outlier`, and were penalised as noise while
  # a 173-character author block became H1.
  #
  # An absolute character floor separates a real heading from a stray large
  # glyph, which is what the mass rule was actually for: a Bates stamp is ~9
  # characters and a page number is 1-3, while a heading is 15 or more.
  min_level_chars: 14
  size_bucket: 0.5
  max_levels: 4
  # Score per hierarchy level: H1 is the document's largest *substantial* type.
  level_scores: {h1: 1.00, h2: 0.72, h3: 0.45, body: 0.20, outlier: 0.05}
  # A size holding more characters than this is body text by definition, however
  # large it is - a document set entirely in 14pt has no 14pt heading.
  body_mass_floor: 0.35

# --- Presentability ---------------------------------------------------------
#
# Whether a string is suitable to print on a binder tab. This is the score that
# encodes "a paralegal should recognise it at a glance", and it is deliberately
# separate from relevance: the most topically relevant string in a document is
# often a whole sentence.
presentability:
  # Calibrated against the 77 harvested titles, not assumed. Their word counts
  # run min 2, p25 4, MEDIAN 7, p75 11, p90 15, max 26; 39% exceed 8 words and
  # 30% exceed 72 characters.
  #
  # The original 3-8 / 72 band matched the median and punished the whole upper
  # tail, which made presentability measurably HARMFUL in ablation (+0.052 top1
  # when disabled). Widening the band keeps the prose defences - which fire on
  # sentence punctuation, stopword ratio and the >18-word cliff - while no
  # longer penalising a genuine 11-word document title.
  ideal_words: [3, 12]
  acceptable_words: [2, 18]
  # Articles may legitimately OPEN a title ("A Design of a Modular ...");
  # prepositions may not ("of Discovery Responses"). Splitting them stops a
  # correct document title being penalised for its first word.
  opening_articles: ["a", "an", "the"]
  max_chars: 95
  ideal_chars: 60
  penalties:
    too_few_words: -0.45
    too_many_words: -0.55
    over_max_chars: -0.40
    ends_with_connector: -0.35     # "Motion to" is not a label
    starts_with_connector: -0.30
    sentence_punctuation: -0.30    # internal . ! ? => prose, not a heading
    trailing_punctuation: -0.15
    high_stopword_ratio: -0.35     # reads as a sentence
    digit_heavy: -0.30
    furniture_word: -0.25
    all_caps_verbose: -0.15        # shouted paragraph
    unbalanced_brackets: -0.20
    repeated_whitespace_artifact: -0.20
  bonuses:
    ideal_length: 0.30
    title_case_consistent: 0.12
    caps_heading: 0.10             # ALL CAPS is conventional for legal headings
  stopword_ratio_max: 0.55
  digit_ratio_max: 0.30

# --- Identity Composer ------------------------------------------------------
#
# Weighted fusion of independent evidence. Every source is normalised to 0-1
# across the candidate set for THIS document before weighting, so no source can
# dominate through raw scale.
#
# These weights are a starting point defended by ablation, not by intuition.
# Run: python tools/evaluate_labels.py --corpus <pdfs> --ablate
composer:
  weights:
    typography:     2.40   # strongest single predictor of a document's own heading
    presentability: 1.60   # binder suitability, not topical relevance
    position:       1.20   # first page, upper region, first occurrence
    bm25:           0.90
    textrank:       0.70
    rake:           0.60
    graph_bonus:    0.50   # candidate was composed from a coherent unit chain
  penalties:
    furniture:     -1.20
    noise:         -2.00
    not_first_page: -1.00
  # Near-duplicate suppression: candidates sharing this token overlap collapse,
  # keeping the higher scorer. Without it the top 3 is one phrase three times.
  duplicate_overlap: 0.70
  top_n: 3
  # Confidence is set by the MARGIN between first and second, which measured far
  # better than absolute score. Calibrated in tools/evaluate_labels.py.
  confidence:
    auto_margin: 99.0     # disabled until a band earns it - see README
    review_margin: 0.10
